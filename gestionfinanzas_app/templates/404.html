{% extends 'base.html' %}

{% block title %}Página no encontrada - 404{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 fw-bold text-danger">404</h1>
    <h3 class="mb-3">Registro o Ruta No Encontrada</h3>
    <p class="text-muted mb-4">{{ mensaje_error|default:"La ruta a la que intentas acceder no existe en la plataforma de finanzas." }}</p>
    <a href="/" class="btn btn-primary">Volver al Inicio</a>
</div>
{% endblock %}
